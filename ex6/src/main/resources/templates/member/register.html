<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/basic::setContent(~{this::content})}">
  <th:block th:fragment="content">
    <style>
        .form-group {
            margin: 30px 0 30px 0;
        }

        .uploadResult {
            width: 100%;
            background: gray;
            margin-top: 10px;
        }

        .uploadResult ul {
            display: flex;
            flex-flow: row;
            justify-content: center;
            align-items: center;
            overflow: auto;
        }

        .uploadResult ul li {
            list-style: none;
            padding: 10px;
            margin-left: 2em;
        }

        .uploadResult ul li img {
            width: 100px;
        }
    </style>
    <h1 class="mt-4">Member Register Page</h1>
    <form th:action="@{/member/register}" method="post">
      <div class="form-group">
        <label for="nickname">nickname</label>
        <input type="text" name="nickname" id="nickname" class="form-control" placeholder="nickname" />
      </div>
      <div class="form-group">
        <label for="email">email</label>
        <input type="text" name="email" id="email" class="form-control" placeholder="이메일" />
      </div>
      <div class="form-group">
        <label for="pw">PassWord</label>
        <input type="text" name="pw" id="pw" class="form-control" placeholder="비밀번호" />
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-primary btn-register">Submit</button>
      </div>
    </form>
    <script th:inline="javascript">
      const form = document.querySelector("form")
      const btnRegister = document.querySelector(".btn-register")
      const nickname = document.querySelector("#nickname")
      const email = document.querySelector("#email")
      const pass = document.querySelector("#pw")

      btnRegister.onclick = e => {
        e.preventDefault()
        if (!nickname.value) {
          nickname.setAttribute('placeholder', "nickname을 확인해주세요")
          nickname.focus();
          return;
        }
        if (!email.value) {
          email.setAttribute('placeholder', "email을 확인해주세요")
          email.focus();
          return;
        }
        if (!pass.value) {
          pass.setAttribute('placeholder', "password를 확인해주세요")
          pass.focus();
          return;
        }
        form.submit()
      }
    </script>
  </th:block>
</th:block>
</html>
