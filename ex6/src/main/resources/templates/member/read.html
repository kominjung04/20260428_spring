<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/basic::setContent(~{this::content})}">
  <th:block th:fragment="content">
    <style>
        .form-group {margin-bottom: 20px;}
        .modal-body input {margin-bottom: 10px;}
        .uploadResult {width: 100%;background: gray;margin-top: 10px;}
        .uploadResult ul {
            display: flex;flex-flow: row;justify-content: center;
            align-items: center;vertical-align: top;overflow: auto;
        }
        .uploadResult ul li {list-style: none;padding: 10px;margin-left: 2em;}
        .uploadResult ul li img {width: 100px;}
        .star {position: relative;font-size: 2rem;color: #ddd;}
        .star input {width: 100%;height: 100%;position: absolute;left: 0;
            opacity: 0;cursor: pointer;}
        .star span {width: 0;position: absolute;left: 0;color: #ffc83d;
            overflow: hidden;pointer-events: none;-webkit-text-stroke: 2px black;
        }
    </style>
    <h1 class="mt-4">Member Read Page</h1>
    <form th:action="@{/member/register}" method="post">
      <div class="form-group">
        <label for="mid">Mid</label>
        <input type="text" name="mid" id="mid" class="form-control" th:value="${memberDTO.mid}" readonly/>
      </div>
      <div class="form-group">
        <label for="nickname">nickname</label>
        <input type="text" name="nickname" id="nickname" class="form-control" th:value="${memberDTO.nickname}" readonly/>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="text" name="email" id="email" class="form-control"
               th:value="${memberDTO.email}" readonly/>
      </div>
      <div class="form-group">
        <label>Regist Date</label>
        <input type="text" class="form-control"
               th:value="${#temporals.format(memberDTO.regDate, 'yyyy/MM/dd hh:mm')}" readonly>
      </div>
      <div class="form-group">
        <label>Modified Date</label>
        <input type="text" class="form-control"
               th:value="${#temporals.format(memberDTO.modDate, 'yyyy/MM/dd hh:mm')}" readonly>
      </div>
      <div class="form-group">
        <a th:href="@{/member/modify(page=${pageRequestDTO.page}, mid=${memberDTO.mid}, type=${pageRequestDTO.type},keyword=${pageRequestDTO.keyword})}"
           class="btn btn-primary">Modify</a>
        <a th:href="@{/member/list(page=${pageRequestDTO.page}, type=${pageRequestDTO.type},keyword=${pageRequestDTO.keyword})}"
           class="btn btn-info">List</a>
      </div>
    </form>
    <!-- start bootstrap.com modal -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <!-- <button type="button"  class="btn btn-primary">Save changes</button> -->
          </div>
        </div>
      </div>
    </div>
    </script>
  </th:block>
</th:block>
</html>
