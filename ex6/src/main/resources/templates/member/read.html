<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{layout/basic::setContent(~{this::content})}">
  <th:block th:fragment="content">
    <style>
        .form-group {margin-bottom: 20px;}
        .modal-body input {margin-bottom: 10px;}
        .uploadResult {width: 100%;background: gray;margin-top: 10px;}
        .uploadResult ul {
            display: flex;flex-flow: row;justify-content: center;
            align-items: center;vertical-align: top;overflow: auto;
        }
        .uploadResult ul li {list-style: none;padding: 10px;margin-left: 2em;}
        .uploadResult ul li img {width: 100px;}
        .star {position: relative;font-size: 2rem;color: #ddd;}
        .star input {width: 100%;height: 100%;position: absolute;left: 0;
            opacity: 0;cursor: pointer;}
        .star span {width: 0;position: absolute;left: 0;color: #ffc83d;
            overflow: hidden;pointer-events: none;-webkit-text-stroke: 2px black;
        }
    </style>
    <h1 class="mt-4">Movie Read Page</h1>
    <form th:action="@{/movie/register}" method="post">
      <div class="form-group">
        <label for="mno">Mno</label>
        <input type="text" name="mno" id="mno" class="form-control" th:value="${movieDTO.mno}" readonly/>
      </div>
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" name="title" id="title" class="form-control" th:value="${movieDTO.title}" readonly/>
      </div>
      <div class="form-group">
        <label for="avg">Average Rating</label>
        <input type="text" name="avg" id="avg" class="form-control"
               th:value="${movieDTO.avg}" readonly/>
      </div>
      <div class="form-group">
        <label for="reviewCnt">Review Count</label>
        <input type="text" name="reviewCnt" id="reviewCnt" class="form-control"
               th:value="${movieDTO.reviewCnt}" readonly>
      </div>
      <div class="form-group">
        <label>Regist Date</label>
        <input type="text" class="form-control"
               th:value="${#temporals.format(movieDTO.regDate, 'yyyy/MM/dd hh:mm')}" readonly>
      </div>
      <div class="form-group">
        <label>Modified Date</label>
        <input type="text" class="form-control"
               th:value="${#temporals.format(movieDTO.modDate, 'yyyy/MM/dd hh:mm')}" readonly>
      </div>
      <div class="form-group">
        <a th:href="@{/movie/modify(page=${pageRequestDTO.page}, mno=${movieDTO.mno}, type=${pageRequestDTO.type},keyword=${pageRequestDTO.keyword})}"
           class="btn btn-primary">Modify</a>
        <a th:href="@{/movie/list(page=${pageRequestDTO.page}, type=${pageRequestDTO.type},keyword=${pageRequestDTO.keyword})}"
           class="btn btn-info">List</a>
      </div>
      <div class="form-group">
        <span class="btn btn-outline-secondary" onclick="addReview()">Add Review</span>
        <span style="font-size:9pt">댓글:<span id="revCnt" th:text="${movieDTO.reviewCnt}"></span> 개</span>
      </div>
      <div class="list-group reviewList" style="margin: 20px 0;"></div><!--댓글목록표시공간-->
    </form>
    <!-- start bootstrap.com modal -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <!-- <button type="button"  class="btn btn-primary">Save changes</button> -->
          </div>
        </div>
      </div>
    </div>
    <script th:inline="javascript">
      const mno = /*[[${movieDTO.mno}]]*/'mno'
      const url = /*[[@{/reviews}]]*/'url'
      // document 순서대로 읽혀지고 난뒤 onload가 무조건 실행
      window.onload = () => {
        let msg = /*[[${msg}]]*/'msg'
        if (msg) {
          const myModal = new bootstrap.Modal(document.querySelector('#myModal'), {backdrop: true});
          document.querySelector(".modal-title").innerHTML = '<p>알림</p>'
          document.querySelector(".modal-body").textContent = msg
          myModal.show();
          history.replaceState({}, null, null) //모달창 띄운 흔적을 history에서 제거
        }
        loadReviewJSON();
      }

      function loadReviewJSON() {
        const reviewList = document.querySelector(".reviewList")
        fetch(url + "/" + mno, {method: 'GET'})
            .then(res => res.json()) //json(),text(),blob(),formData(),arrayBuffer()
            .then(data => {  // java에서 List<ReviewDTO>의 목록을 받음
              let str = ""
              for (let i = 0; i < data.length; i++) {
                str += `<div class="card-body form-control mb-1"
                onmouseover="this.style.background='#d6efff'"
                onmouseout="this.style.background='white'"
                            data-review-num="${data[i].reviewNum}" data-text="${data[i].text}"
                            data-mid="${data[i].mid}" data-grade="${data[i].grade}"
                            data-email="${data[i].email}" data-nickname="${data[i].nickname}"
                            style="padding:5px 20px;cursor:pointer;"
                            onclick="viewReview('${data[i].reviewNum}','${data[i].text}','${data[i].mid}',
                            '${data[i].grade}', '${data[i].nickname}')"
                            >
                                <div style="display:inline-block;width:43%">
                                    <h6 style="display:inline-block;width:70px">${data[i].reviewNum}</h6>
                                    <h5 class="card-text" style="display:inline-block;">${data[i].text}</h5>
                                </div>
                                <div style="display:inline-block;width:17%;text-align:left;">
                                    <span class="star-rating" data-grade="${data[i].grade}"></span>
                                </div>
                                <div style="display:inline-block;width:55%;text-align:right;right-padding:20px;">
                                    <span class="card-subtitle text-muted">${data[i].nickname}</span>
                                    <span class="card-subtitle text-muted"
                                    style="display:inline-block;width:200px;color:rgb(148, 163, 184);"
                                    >${new Date(data[i].regDate).toLocaleString()}</span>
                                </div>
                            </div>
                `
              }
              reviewList.innerHTML = str;// 물리적 돔트리에 str을 마운트함.
              const starRatings = document.querySelectorAll(".star-rating");
              for (let i = 0; i < starRatings.length; i++) {
                let strStar = '';
                for (let j = 0; j < starRatings[i].dataset.grade; j++) {
                  strStar += `⭐`
                }
                starRatings[i].innerHTML = strStar;
              }
            })
      }

      function addReview() {
        const myModal = new bootstrap.Modal(document.querySelector('#myModal'), {backdrop: true});
        document.querySelector("#exampleModalLabel").textContent = "Review 추가"
        document.querySelector(".modal-body").innerHTML = `
          <labe>회원 번호</labe>
          <input type="text" class="form-control" name="mid" />
          <label>Grade</label>
          <span class="star">★★★★★<span>★★★★★</span>
          <input type="range" oninput="drawStar(this)" value="1" step="2" min="0" max="10" />
          </span><br/>
          <input type="text" class="form-control" name="text" placeholder="Review...">
          <label>회원 Email</label>
          <input type="text" class="form-control" name="email" placeholder="Email">
        `
        document.querySelector(".modal-footer").innerHTML = `
          <button type="button" class="btn btn-primary save" data-bs-dismiss="modal"
                    onclick="saveReview()">등록</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        `
        myModal.show()
      }

      function drawStar(target) { // 별을 클릭할 때마다 grade의 수치를 생성해주는 함수
        document.querySelector(".star span").style.width = `${target.value * 10}%`
      }

      function saveReview() {
        const text = document.querySelector(".modal-body input[name='text']")
        const mid = document.querySelector(".modal-body input[name='mid']")
        const grade = parseFloat(document.querySelector(".star span").style.width) * 0.01 * 5
        if(!mid.value) {mid.setAttribute('placeholder', '회원번호를 확인하세요');return;}
        if(!text.value) {text.setAttribute('placeholder', 'Review를 확인하세요');return;}
        if(Number.isNaN(grade)) {alert("Review 별점을 확인하세요"); return;}
        const review = {mno: mno, text: text.value, mid: mid.value, grade: grade} // js 객체생성
        console.log(review)
        fetch(url, {
          method: 'POST', headers: {'Content-type': 'application/json'},
          body: JSON.stringify(review) //js객체를 json으로 변환
        })
            .then(res => res.text()) // json(),text(),blob(),formData(),arrayBuffer()
            .then(function (data) {
              const myModal = new bootstrap.Modal(document.querySelector('#myModal'), {backdrop: true});
              document.querySelector("#exampleModalLabel").textContent = "Review 등록 완료"
              document.querySelector(".modal-body").innerHTML = `${data} 알림`
              document.querySelector(".modal-footer .save").style.display = 'none'
              let cnt = document.querySelector("#revCnt")
              cnt.textContent = parseInt(cnt.textContent) + 1;
              myModal.show() // 댓글 등록 완료 모달
              loadReviewJSON()
            })
      }

      function viewReview(reviewNum, text, commenter) {
        const myModal = new bootstrap.Modal(document.querySelector('#myModal'), {backdrop: true});
        document.querySelector("#exampleModalLabel").textContent = reviewNum + "번 댓글 보기"
        document.querySelector(".modal-body").innerHTML = `
          <input type="text" class="form-control" name="reviewNum" value="${reviewNum}" readonly>
          <input type="text" class="form-control" name="text" value="${text}">
          <input type="text" class="form-control" name="commenter" value="${commenter}" readonly>
        `
        document.querySelector(".modal-footer").innerHTML = `
          <button type="button" class="btn btn-warning modify" data-bs-dismiss="modal" onclick="updateReview('${reviewNum}')">수정</button>
          <button type="button" class="btn btn-danger remove" data-bs-dismiss="modal" onclick="removeReview('${reviewNum}')">삭제</button>
          <span class="btn btn-secondary" data-bs-dismiss="modal">닫기</span>
        `
        myModal.show() // 댓글 입력을 위한 모달
      }

      function updateReview(reviewNum) {
        const text = document.querySelector(".modal-body input[name='text']")
        if (!text.value || text.value == '') {
          text.setAttribute('placeholder', '댓글을 입력하세요')
          text.focus()
          return false;
        }

        let review = {reviewNum: reviewNum, text: text.value}
        fetch(url, {
          method: 'PUT', headers: {'Content-type': 'application/json'},
          body: JSON.stringify(review)
        })
            .then(res => res.text())
            .then(function (data) {
              const myModal = new bootstrap.Modal(document.querySelector('#myModal'), {backdrop: true});
              document.querySelector("#exampleModalLabel").textContent = "댓글 수정 완료"
              document.querySelector(".modal-body").innerHTML = `${data} 알림`
              document.querySelector(".modal-footer .modify").style.display = 'none'
              document.querySelector(".modal-footer .remove").style.display = 'none'
              myModal.show()
              loadReviewJSON()
            })
      }

      function removeReview(reviewNum) {
        const review = {reviewNum: reviewNum}
        fetch(url, {
          method: 'DELETE', headers: {'Content-type': 'application/json'},
          body: JSON.stringify(review)
        })
            .then(res => res.text())
            .then(function (data) {
              const myModal = new bootstrap.Modal(document.querySelector('#myModal'), {backdrop: true});
              document.querySelector("#exampleModalLabel").textContent = "댓글 삭제 완료"
              document.querySelector(".modal-body").innerHTML = `${data} 알림`
              document.querySelector(".modal-footer .modify").style.display = 'none'
              document.querySelector(".modal-footer .remove").style.display = 'none'
              myModal.show()
              loadReviewJSON()
            })
      }
    </script>
  </th:block>
</th:block>
</html>
